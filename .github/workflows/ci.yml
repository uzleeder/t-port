name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests on PostgreSQL, audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tport
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tport_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tport -d tport_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TPORT_TEST_DATABASE_URL: postgresql+psycopg://tport:ci-only-password@127.0.0.1:5432/tport_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,ai]" pip-audit
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest -p no:cacheprovider
      - name: Provider contract conformance (registered providers)
        run: python -m app.cli check-provider demo --days 3
      - name: Migrations apply cleanly to PostgreSQL and match the models
        env:
          TPORT_DATABASE_URL: ${{ env.TPORT_TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable

  frontend:
    name: Frontend (lint, types, unit tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      CI: "1"
      TPORT_ENVIRONMENT: test
      TPORT_DATABASE_URL: sqlite:///${{ github.workspace }}/e2e.db
      TPORT_CORS_ORIGINS: '["http://localhost:2028"]'
      # Locally every request arrives from 127.0.0.1 (no front proxy), so raise the per-IP limits.
      TPORT_RATE_LIMIT_PER_MINUTE: "1000"
      TPORT_AUTH_RATE_LIMIT_PER_MINUTE: "100"
      # Lets e2e tests exercise provider outages and stale data (forbidden in production).
      TPORT_ENABLE_FAULT_SIMULATION: "true"
      E2E_API_COMMAND: >-
        cd ../backend && python -m alembic upgrade head &&
        python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ./backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - name: Post-deployment smoke test against the built app
        run: |
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &)
          (cd frontend && npm run start > ../web.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://localhost:2028/health > /dev/null && break; sleep 2; done
          python deploy/smoke_test.py http://localhost:2028
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tport-api ./backend
      - run: docker build -t tport-web --build-arg API_INTERNAL_URL=http://api:8000 ./frontend
